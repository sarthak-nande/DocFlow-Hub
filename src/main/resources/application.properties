spring.application.name=docflow-hub
spring.data.mongodb.uri=${MONGODB_URL:mongodb://localhost:27017/docflow-db}
spring.data.mongodb.database=${MONGODB_DB_NAME:docflow-db}
server.port=${SERVER_PORT:5000}

# Local storage directory for documents
file.upload-dir=uploads/docflow-files

# Optional: Limit file upload size (Spring defaults to 1MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
 
# SMTP Mail Configuration (with fallback defaults if env vars are missing)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_REQUIRED:false}

# JWT Secret Fallback
JWT_SECREATE=${JWT_SECREATE:${JWT_SECRET:defaultSecretKeyForDocFlowHubSystem2026SecureKey32BytesLong}}
